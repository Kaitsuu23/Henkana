name: henkana_flutter
description: Henkana - Anime & Manga Streaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  dio: ^5.4.3+1
  # State management
  provider: ^6.1.2
  # Video player
  video_player: ^2.8.6
  # Image
  cached_network_image: ^3.3.1
  # Utils
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.10
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon.png
